<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gedeelde Rekening</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 24px 14px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 28px;
    }

    .subtitle {
      color: #6b7280;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .login-card {
      max-width: 450px;
      margin: 50px auto;
    }

    .balance-label {
      color: #6b7280;
      font-size: 15px;
    }

    #currentBalance {
      font-size: 36px;
      font-weight: bold;
      margin-top: 8px;
      color: #159447;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button,
    .save-button {
      background: #1f2937;
      color: white;
      width: 100%;
      margin-top: 20px;
    }

    .add-button {
      margin-top: 20px;
      color: white;
      background: #1f2937;
    }

    .logout-button {
      background: #e5e7eb;
      color: #374151;
      float: right;
    }

    .form-card {
      display: none;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }

    .table-card {
      background: white;
      margin-top: 20px;
      border-radius: 18px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 560px;
    }

    th {
      background: #f8fafc;
      color: #6b7280;
      font-size: 13px;
      text-align: left;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #eeeeee;
    }

    th:nth-child(3),
    th:nth-child(4),
    td:nth-child(3),
    td:nth-child(4) {
      text-align: right;
    }

    .income {
      color: #159447;
      font-weight: bold;
    }

    .expense {
      color: #dc2626;
      font-weight: bold;
    }

    .positive {
      color: #159447;
      font-weight: bold;
    }

    .negative {
      color: #dc2626;
      font-weight: bold;
    }

    .clearfix::after {
      content: "";
      display: table;
      clear: both;
    }

    @media (max-width: 600px) {
      .container {
        padding: 16px 10px;
      }

      h1 {
        font-size: 24px;
      }

      #currentBalance {
        font-size: 30px;
      }

      th,
      td {
        padding: 12px 8px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginSection">

    <div class="container">

      <div class="card login-card">

        <h1>Gedeelde Rekening</h1>

        <p class="subtitle">
          Log in om de rekening te bekijken
        </p>

        <label for="loginEmail">
          E-mailadres
        </label>

        <input
          type="email"
          id="loginEmail"
          autocomplete="email"
          placeholder="E-mailadres"
        >

        <label for="loginPassword">
          Wachtwoord
        </label>

        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          placeholder="Wachtwoord"
        >

        <button
          class="login-button"
          onclick="login()"
        >
          Inloggen
        </button>

      </div>

    </div>

  </div>


  <!-- APP -->

  <div
    id="appSection"
    style="display:none;"
  >

    <div class="container">

      <div class="clearfix">

        <button
          class="logout-button"
          onclick="logout()"
        >
          Uitloggen
        </button>

        <h1>
          Rekeningoverzicht
        </h1>

        <p class="subtitle">
          Gedeelde rekening
        </p>

      </div>


      <!-- BALANCE -->

      <div class="card">

        <div class="balance-label">
          Huidig saldo
        </div>

        <div id="currentBalance">
          TSh 0
        </div>

        <button
          class="add-button"
          onclick="toggleForm()"
        >
          + Nieuwe transactie
        </button>

      </div>


      <!-- NEW TRANSACTION -->

      <div
        class="card form-card"
        id="transactionForm"
      >

        <h2>
          Nieuwe transactie
        </h2>

        <label for="date">
          Datum
        </label>

        <input
          type="date"
          id="date"
        >

        <label for="description">
          Omschrijving
        </label>

        <input
          type="text"
          id="description"
          placeholder="Bijv. transport"
        >

        <label for="type">
          Type
        </label>

        <select id="type">

          <option value="income">
            Geld erbij
          </option>

          <option value="expense">
            Geld eraf
          </option>

        </select>


        <label for="amount">
          Bedrag (TSh)
        </label>

        <input
          type="number"
          id="amount"
          min="1"
          step="1"
          inputmode="numeric"
          placeholder="Bijv. 250000"
        >


        <button
          class="save-button"
          onclick="addTransaction()"
        >
          Opslaan
        </button>

      </div>


      <!-- TRANSACTIONS -->

      <div class="table-card">

        <table>

          <thead>

            <tr>
              <th>Datum</th>
              <th>Omschrijving</th>
              <th>Bedrag</th>
              <th>Saldo</th>
            </tr>

          </thead>

          <tbody id="transactionTable">
          </tbody>

        </table>

      </div>

    </div>

  </div>


  <!-- FIREBASE -->

  <script
    type="module"
    src="./firebase-app.js">
  </script>

</body>
</html>
