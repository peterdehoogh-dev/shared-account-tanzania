<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shared Account</title>

  <link rel="manifest" href="./manifest.json">

  <meta
    name="theme-color"
    content="#1f2937"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icon-192.png"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 14px;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #6b7280;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .login-card {
      max-width: 450px;
      margin: 50px auto;
    }

    .balance-label {
      color: #6b7280;
      font-size: 15px;
    }

    #currentBalance {
      font-size: 36px;
      font-weight: bold;
      margin-top: 8px;
      color: #159447;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button,
    .save-button {
      background: #1f2937;
      color: white;
      width: 100%;
      margin-top: 20px;
    }

    .add-button {
      margin-top: 20px;
      color: white;
      background: #1f2937;
    }

    .logout-button {
      background: #e5e7eb;
      color: #374151;
      float: right;
    }

    .cancel-button {
      background: #e5e7eb;
      color: #374151;
      width: 100%;
      margin-top: 10px;
    }

    .edit-button {
      background: #e0f2fe;
      color: #075985;
      padding: 7px 10px;
      margin-right: 5px;
      font-size: 13px;
    }

    .delete-button {
      background: #fee2e2;
      color: #b91c1c;
      padding: 7px 10px;
      font-size: 13px;
    }

    .form-card {
      display: none;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    .table-card {
      background: white;
      margin-top: 20px;
      border-radius: 18px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 700px;
    }

    th {
      background: #f8fafc;
      color: #6b7280;
      font-size: 13px;
      text-align: left;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #eeeeee;
    }

    th:nth-child(3),
    th:nth-child(4),
    td:nth-child(3),
    td:nth-child(4) {
      text-align: right;
    }

    .actions-cell {
      white-space: nowrap;
      text-align: right;
    }

    .income {
      color: #159447;
      font-weight: bold;
    }

    .expense {
      color: #dc2626;
      font-weight: bold;
    }

    .positive {
      color: #159447;
      font-weight: bold;
    }

    .negative {
      color: #dc2626;
      font-weight: bold;
    }

    .clearfix::after {
      content: "";
      display: table;
      clear: both;
    }

    @media (max-width: 600px) {

      .container {
        padding: 16px 10px;
      }

      h1 {
        font-size: 24px;
      }

      #currentBalance {
        font-size: 30px;
      }

      th,
      td {
        padding: 12px 8px;
        font-size: 13px;
      }

      .edit-button,
      .delete-button {
        display: block;
        width: 100%;
        margin: 3px 0;
      }
    }

  </style>
</head>

<body>


  <!-- LOGIN SECTION -->

  <div id="loginSection">

    <div class="container">

      <div class="card login-card">

        <h1>
          Shared Account
        </h1>

        <p class="subtitle">
          Log in to view the account
        </p>


        <label for="loginEmail">
          Email address
        </label>

        <input
          type="email"
          id="loginEmail"
          autocomplete="email"
          placeholder="Email address"
        >


        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          placeholder="Password"
        >


        <button
          class="login-button"
          onclick="login()"
        >
          Log In
        </button>

      </div>

    </div>

  </div>


  <!-- APP SECTION -->

  <div
    id="appSection"
    style="display:none;"
  >

    <div class="container">


      <!-- HEADER -->

      <div class="clearfix">

        <button
          class="logout-button"
          onclick="logout()"
        >
          Log Out
        </button>

        <h1>
          Account Overview
        </h1>

        <p class="subtitle">
          Shared Account
        </p>

      </div>


      <!-- CURRENT BALANCE -->

      <div class="card">

        <div class="balance-label">
          Current Balance
        </div>

        <div id="currentBalance">
          TSh 0
        </div>

        <button
          class="add-button"
          onclick="toggleForm()"
        >
          + New Transaction
        </button>

      </div>


      <!-- TRANSACTION FORM -->

      <div
        class="card form-card"
        id="transactionForm"
      >

        <h2 id="formTitle">
          New Transaction
        </h2>


        <label for="date">
          Date
        </label>

        <input
          type="date"
          id="date"
        >


        <label for="description">
          Description
        </label>

        <input
          type="text"
          id="description"
          placeholder="For example: transport"
        >


        <label for="type">
          Type
        </label>

        <select id="type">

          <option value="income">
            Money In
          </option>

          <option value="expense">
            Money Out
          </option>

        </select>


        <label for="amount">
          Amount (TSh)
        </label>

        <input
          type="number"
          id="amount"
          min="1"
          step="1"
          inputmode="numeric"
          placeholder="For example: 250000"
        >


        <button
          id="saveTransactionButton"
          class="save-button"
          onclick="addTransaction()"
        >
          Save
        </button>


        <button
          class="cancel-button"
          onclick="cancelTransaction()"
        >
          Cancel
        </button>

      </div>


      <!-- TRANSACTIONS TABLE -->

      <div class="table-card">

        <table>

          <thead>

            <tr>

              <th>
                Date
              </th>

              <th>
                Description
              </th>

              <th>
                Amount
              </th>

              <th>
                Balance
              </th>

              <th style="text-align:right;">
                Actions
              </th>

            </tr>

          </thead>

          <tbody id="transactionTable">
          </tbody>

        </table>

      </div>

    </div>

  </div>


  <!-- FIREBASE -->

  <script
    type="module"
    src="./firebase-app.js">
  </script>


  <!-- SERVICE WORKER -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")

            .then(() => {

              console.log(
                "Service Worker registered"
              );

            })

            .catch((error) => {

              console.error(
                "Service Worker registration failed:",
                error
              );

            });

        }
      );

    }

  </script>


</body>
</html>
